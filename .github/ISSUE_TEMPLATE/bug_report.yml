name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传真实学生个人信息、健康情况、行为标签、备注或可识别截图。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从空白页面开始如何复现。
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: Chrome 126 / Edge 126 / Safari 18
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS / iOS / Android
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交真实学生个人信息或敏感数据。
          required: true
