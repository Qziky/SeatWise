name: Feature request
description: 建议新的能力或改进现有流程
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请尽量描述真实教学流程中的问题，但不要包含真实学生个人信息。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪个流程不够顺手，或者老师需要完成什么事？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望 SeatWise 如何支持这个场景？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 学生管理
        - 教室布局
        - 规则配置
        - 排座算法
        - 隐私视图
        - 导入导出
        - 历史记录
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私影响
      options:
        - label: 这个建议可能影响学生隐私、导出、分享或长期数据留存。
          required: false
